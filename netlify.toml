[build]
  publish = "."
  functions = "netlify/functions"

[dev]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/booking"
  to = "/.netlify/functions/booking"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
